name: Stepler
options:
  bundleIdPrefix: com.stepler
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: CQCZ5G8D6H
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.3.16"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "12.19.1"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "9.0.0"
targets:
  Stepler:
    type: application
    platform: iOS
    sources: [Stepler]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stepler.app.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Stepler/Info.plist
      properties:
        CFBundleDisplayName: Stepler
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCalendarsFullAccessUsageDescription: Stepler can mirror your dated tasks to your default calendar when you enable calendar sync.
        NSRemindersFullAccessUsageDescription: Stepler can mirror your dated tasks to Apple Reminders when you enable reminder sync.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.googleusercontent.apps.638697418683-56g68ro91lns4hetj4m7ngfkbbll3271]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn
  SteplerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SteplerTests]
    dependencies: [{ target: Stepler }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SteplerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SteplerUITests]
    dependencies: [{ target: Stepler }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Stepler:
    build:
      targets:
        Stepler: all
    test:
      targets: [SteplerTests, SteplerUITests]
      gatherCoverageData: true
