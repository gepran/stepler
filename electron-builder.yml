appId: com.stepler.app
productName: Stepler
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{build_icon.js,gen-icons.mjs,logo.svg,docs,dist}"
  # Everything below shipped by accident in 1.3.3. This list is an allow-by-
  # default one, so any new top-level file or folder in the repo lands inside
  # the app unless it is named here — including private tooling directories.
  - "!{.gstack,.claude,.firebase,.github}"
  - "!{.firebaserc,firebase.json,firestore.rules,firestore.indexes.json,storage.rules}"
  - "!{dist-web,vite.web.config.mjs,src/web}"
  # stepler-cli.mjs deliberately stays: it shipped before, and the MCP
  # server next to it is shipped on purpose for the same reason.
  - "!{index.js,.eslintcache}"
asarUnpack:
  - resources/**
  # A plain `node` cannot run a file from inside an asar, and pointing a
  # coding agent at this one is the whole point of shipping it.
  - stepler-mcp.mjs
win:
  target: nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # A mapping, not a list. As a list electron-builder writes each entry under a
  # numeric key ("0", "1", ...) and macOS, which looks at the top level, never
  # sees any of them.
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    # Required to drive the Reminders app over Apple Events. Without it macOS
    # cannot show the Automation prompt and the integration fails with -1743
    # the moment the build is properly signed.
    NSAppleEventsUsageDescription: Stepler mirrors your dated tasks into the Reminders app.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
afterSign: build/afterSign.cjs
npmRebuild: false
publish:
  provider: github
  owner: gepran
  repo: stepler
