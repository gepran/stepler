<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Stepler</title>
    <meta name="color-scheme" content="light dark" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         `stepler-file:` is the app's own attachment scheme, served from the
         user's attachment folder by the main process. No remote origins are
         allowed: nothing in this window should ever reach the network. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: stepler-file:; media-src 'self' blob: stepler-file:; frame-src 'self' blob: stepler-file:; object-src 'self' blob: stepler-file:; connect-src 'self' blob: stepler-file:; base-uri 'none'; form-action 'none';"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
